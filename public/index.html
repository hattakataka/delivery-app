<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品配送管理（共有版）</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --text:#1f2937; --muted:#6b7280;
    --line:#d9dee5; --accent:#2563eb; --danger:#dc2626; --ok:#15803d;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
         background:var(--bg); color:var(--text); }
  header { background:#1f2937; color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:22px; }
  main { max-width:1400px; margin:20px auto; padding:0 16px 40px; }
  .grid { display:grid; grid-template-columns:420px 1fr; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .card h2 { font-size:17px; margin:0 0 14px; }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 6px; }
  input, select, textarea, button { font:inherit; border-radius:7px; border:1px solid #cbd5e1; }
  input, select, textarea { width:100%; padding:9px 10px; background:#fff; }
  button { padding:9px 13px; cursor:pointer; background:#fff; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:#fff; background:var(--danger); border-color:var(--danger); }
  button.small { padding:4px 6px; font-size:11px; white-space:nowrap; }
  .method { display:grid; grid-template-columns:1fr; gap:7px; }
  .method label { margin:0; font-weight:400; border:1px solid var(--line); padding:9px; border-radius:7px; cursor:pointer; }
  .method input { width:auto; margin-right:6px; }
  .items { border:1px solid var(--line); border-radius:8px; padding:8px; min-height:90px; }
  .item-row { display:flex; gap:6px; margin-bottom:6px; }
  .item-row input:first-child { flex:0 0 105px; }
  .item-row input:nth-child(2) { flex:1; }
  .hint { color:var(--muted); font-size:12px; margin-top:5px; }
  .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tab { border-radius:20px; padding:7px 12px; }
  .tab.active { background:#e0e7ff; color:#1d4ed8; border-color:#a5b4fc; }
  .table-wrap { overflow:auto; max-height:480px; border:1px solid var(--line); border-radius:8px; }
  
  table { width:100%; border-collapse:collapse; min-width:820px; table-layout:fixed; }
  th, td { padding:8px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { background:#f8fafc; position:sticky; top:0; z-index:1; font-size:12px; }
  td { font-size:12px; }
  
  #itemsTable th:nth-child(1) { width: 65px; }
  #itemsTable th:nth-child(2) { width: 170px; }
  #itemsTable th:nth-child(3) { width: 75px; }
  #itemsTable th:nth-child(4) { width: 85px; }
  #itemsTable th:nth-child(5) { width: 100px; }
  #itemsTable th:nth-child(6) { width: 110px; }
  #itemsTable th:nth-child(7) { width: 140px; }

  .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn-group { display:flex; gap:3px; flex-wrap:nowrap; }

  .badge { display:inline-block; padding:3px 7px; border-radius:999px; background:#eef2ff; color:#3730a3; font-size:11px; }
  .badge.green { background:#dcfce7; color:#166534; }
  .badge.red { background:#fee2e2; color:#b91c1c; }
  .badge.blue { background:#dbeafe; color:#1d4ed8; }
  .badge.purple { background:#f3e8ff; color:#6b21a8; }
  .search { display:flex; gap:8px; margin-bottom:10px; }
  .search input { flex:1; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px; }
  .stat .n { font-size:25px; font-weight:700; }
  .stat .t { color:var(--muted); font-size:12px; }
  .timeline { border-left:3px solid #cbd5e1; margin-left:8px; padding-left:16px; }
  .event { position:relative; padding:5px 0 13px; }
  .event:before { content:""; position:absolute; left:-23px; top:9px; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .event .time { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); padding:20px; text-align:center; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:20; }
  .modal { background:#fff; width:min(700px,100%); max-height:90vh; overflow:auto; border-radius:12px; padding:18px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; }
  .close { border:0; font-size:22px; cursor:pointer; }
  @media(max-width:900px) {
    .grid { grid-template-columns:1fr; }
    .stats { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<div id="loginScreen" class="modal-back" style="display:flex; z-index:100; background:var(--bg);">
  <div class="card" style="width:min(400px, 90%); text-align:center; padding:30px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
    <h2 style="font-size:20px; margin-bottom:6px;">物品配送管理</h2>
    <p class="hint" style="margin-bottom:20px;">ユーザー名を入力してください</p>
    <div style="text-align:left;">
      <label>ユーザー名</label>
      <input id="userNameInput" placeholder="例：山田 太郎" style="margin-bottom:20px;" onkeydown="if(event.key==='Enter') startApp()">
    </div>
    <button class="primary" style="width:100%; padding:11px; font-size:15px;" onclick="startApp()">はじめる</button>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <header>
    <h1>物品配送管理</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:13px; color:#cbd5e1;">ユーザー: <strong id="currentUserDisplay" style="color:#fff;">-</strong></span>
      <button onclick="changeUser()" style="background:#4b5563;color:#fff;border:none;font-size:11px;padding:4px 8px;">変更</button>
      <button onclick="loadDataFromServer()" style="background:#2563eb;color:#fff;border:none;font-size:11px;padding:4px 8px;">最新状態に更新</button>
      <button onclick="resetToInitialData()" style="background:#374151;color:#fff;border:none;font-size:11px;padding:4px 8px;">初期データにリセット</button>
    </div>
  </header>

  <datalist id="itemList"></datalist>

  <main>
    <div class="stats">
      <div class="stat"><div class="n" id="statItems">0</div><div class="t">登録物品数</div></div>
      <div class="stat"><div class="n" id="statMoved">0</div><div class="t">総履歴数</div></div>
      <div class="stat"><div class="n" id="statMoving">0</div><div class="t">現在輸送中の物品</div></div>
      <div class="stat"><div class="n" id="statLocations">0</div><div class="t">現在地の種類</div></div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>配送を記録</h2>
        <div class="tabs">
          <button class="tab active" id="modeDeparture" onclick="setMode('departure')">① 107室から出発</button>
          <button class="tab" id="modeArrival" onclick="setMode('arrival')">② 324室に到着</button>
        </div>

        <div id="departureForm">
          <label>移動方法 <span style="color:#dc2626;">※出発時のみ入力</span></label>
          <div class="method">
            <label><input type="radio" name="method" value="手運び" checked> 手運び</label>
            <label><input type="radio" name="method" value="業者・人間輸送"> 業者・人間輸送</label>
            <label><input type="radio" name="method" value="トラック輸送"> トラック輸送</label>
            <label><input type="radio" name="method" value="その他" onchange="toggleCustomMethod()"> その他</label>
            <input id="customMethod" style="display:none;margin-top:2px;" placeholder="移動方法を入力">
          </div>

          <label>出発する物品 / 箱</label>
          <div id="itemInputs" class="items"></div>
          <div class="hint">※箱を指定すると、その箱に入っている物品も一緒に輸送中になります。</div>

          <div class="actions">
            <button onclick="addItemRow()">＋物品を追加</button>
            <button class="primary" onclick="recordDeparture()">107室から出発を記録</button>
            <button onclick="clearForm()">入力をクリア</button>
          </div>
        </div>

        <div id="arrivalForm" style="display:none;">
          <label>到着した物品 / 箱</label>
          <div id="arrivalInputs" class="items"></div>
          <div class="hint">※箱を到着させると、箱に入っている物品も一緒に到着処理されます。</div>

          <div class="actions">
            <button onclick="addArrivalRow()">＋物品を追加</button>
            <button class="primary" onclick="recordArrival()">324室への到着を記録</button>
            <button onclick="clearArrivalForm()">入力をクリア</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;">
          <h2 style="margin:0;">現在の物品状況</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" onclick="openAdd107Modal()">＋107室にある物品を追加</button>
            <button type="button" onclick="openAddAt324()">＋324室にある物品を追加</button>
          </div>
        </div>
        <div class="search">
          <input id="search" placeholder="番号・物品名・現在地で検索" oninput="render()">
          <button onclick="document.getElementById('search').value='';render()">クリア</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>番号</th><th>物品名</th><th>状態</th><th>現在地</th><th>移動方法</th>
                <th>最終更新</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="itemsTable"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top:16px;">
      <h2>履歴</h2>
      <div class="tabs" id="historyTabs">
        <button class="tab active" id="tabAll" onclick="setHistoryFilter('all')">すべて</button>
        <button class="tab" id="tabCreate" onclick="setHistoryFilter('create')">物品追加</button>
        <button class="tab" id="tabDelivery" onclick="setHistoryFilter('delivery')">物品配送</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>日時</th><th>担当者</th><th>物品</th><th>区分/出発地</th><th>到着地</th><th>種別 / 移動方法</th><th>操作</th></tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">物品詳細</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="add107Modal" class="modal-back">
  <div class="modal">
    <div class="modal-head">
      <h2 style="margin:0;">107室にある物品を追加</h2>
      <button type="button" class="close" onclick="closeAdd107Modal()">×</button>
    </div>
    <p class="hint">107室にある物品を新規登録します。</p>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px;">
      <label style="margin:0;">番号<input id="add107Number" type="text" placeholder="例：401" list="itemList" oninput="autoFillName(this, 'add107Name')"></label>
      <label style="margin:0;">物品名<input id="add107Name" type="text" placeholder="物品名"></label>
    </div>
    <div class="actions" style="justify-content:flex-end;margin-top:16px;">
      <button type="button" onclick="closeAdd107Modal()">キャンセル</button>
      <button type="button" class="primary" onclick="addItemAt107()">追加する</button>
    </div>
  </div>
</div>

<div id="add324Modal" class="modal-back">
  <div class="modal">
    <div class="modal-head">
      <h2 style="margin:0;">324室にある物品を追加</h2>
      <button type="button" class="close" onclick="closeAddAt324()">×</button>
    </div>
    <p class="hint">324室にある物品を新規登録します。</p>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px;">
      <label style="margin:0;">番号<input id="add324Number" type="text" placeholder="例：401" list="itemList" oninput="autoFillName(this, 'add324Name')"></label>
      <label style="margin:0;">物品名<input id="add324Name" type="text" placeholder="物品名"></label>
    </div>
    <div class="actions" style="justify-content:flex-end;margin-top:16px;">
      <button type="button" onclick="closeAddAt324()">キャンセル</button>
      <button type="button" class="primary" onclick="addItemAt324()">追加する</button>
    </div>
  </div>
</div>

<script>
let db = { items: {}, history: [] };
let historyFilter = "all";
let currentUser = "";

// サーバーからデータを読み込む関数の共通化
async function loadDataFromServer() {
  try {
    const res = await fetch('/api/data');
    db = await res.json();
    if (!db.items) db.items = {};
    if (!db.history) db.history = [];
    
    // データが空なら初期セットを自動注入
    if (Object.keys(db.items).length === 0) {
      seedInitialInventory(true);
    } else {
      updateDatalist();
      render();
    }
  } catch (err) {
    alert("サーバーからのデータ読み込みに失敗しました。");
  }
}

// サーバーへデータを保存する関数
async function save() {
  try {
    await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(db)
    });
    updateDatalist();
    render();
  } catch (err) {
    alert("サーバーへの保存に失敗しました。");
  }
}

function startApp() {
  const input = document.getElementById("userNameInput").value.trim();
  if (!input) { alert("ユーザー名を入力してください。"); return; }
  currentUser = input;
  document.getElementById("currentUserDisplay").textContent = currentUser;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  loadDataFromServer();
}

function changeUser() {
  const name = prompt("新しいユーザー名を入力してください:", currentUser);
  if (name !== null && name.trim() !== "") {
    currentUser = name.trim();
    document.getElementById("currentUserDisplay").textContent = currentUser;
  }
}

function itemKey(number, name) {
  if (number) return "NO:" + String(number).trim();
  return "NAME:" + String(name).trim().toLowerCase();
}

function updateDatalist() {
  const dl = document.getElementById("itemList");
  if (!dl) return;
  const items = Object.values(db.items).filter(x => x.number);
  dl.innerHTML = items.map(x => `<option value="${escAttr(x.number)}">${escAttr(x.name)}</option>`).join("");
}

function onNumberInput(inputEl) {
  const val = inputEl.value.trim();
  const nameEl = inputEl.parentElement.querySelector(".item-name");
  if (!val || !nameEl) return;
  const key = "NO:" + val;
  if (db.items[key] && db.items[key].name) { nameEl.value = db.items[key].name; }
}

function autoFillName(inputEl, targetId) {
  const val = inputEl.value.trim();
  const targetEl = document.getElementById(targetId);
  if (!val || !targetEl) return;
  const key = "NO:" + val;
  if (db.items[key] && db.items[key].name) { targetEl.value = db.items[key].name; }
}

function recalculateItemState(itemId) {
  const item = db.items[itemId];
  if (!item) return;

  const itemHistories = db.history
    .filter(h => h.itemId === itemId)
    .sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));

  if (itemHistories.length === 0) {
    const initLoc = item.initialLocation || "107室";
    item.currentLocation = initLoc;
    item.status = (initLoc === "324室") ? "到着済み" : "未出発";
    item.method = "";
    item.departureAt = null;
    item.arrivalAt = null;
    item.updatedAt = new Date().toISOString();
  } else {
    const last = itemHistories[itemHistories.length - 1];
    item.currentLocation = last.to === "?" ? (item.initialLocation || "107室") : last.to;
    item.updatedAt = last.timestamp;

    if (last.type === "create") {
      item.status = (last.from === "324室") ? "到着済み" : "未出発";
      item.method = "";
      item.departureAt = null;
      item.arrivalAt = (last.from === "324室") ? last.timestamp : null;
    } else if (last.type === "departure") {
      item.status = "輸送中";
      item.method = last.method || "";
      item.departureAt = last.timestamp;
      item.arrivalAt = null;
    } else if (last.type === "arrival") {
      item.status = "到着済み";
      const lastDep = [...itemHistories].reverse().find(h => h.type === "departure");
      item.method = lastDep ? lastDep.method : "";
      item.departureAt = lastDep ? lastDep.timestamp : null;
      item.arrivalAt = last.timestamp;
    }
  }
}

  return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function findItemByInput(number, name) {
  if (number) return db.items[itemKey(number, name)] || null;
  const target = String(name).trim().toLowerCase();
  return Object.values(db.items).find(x => !x.number && (x.name || "").trim().toLowerCase() === target) || null;
}

function getChildItemsInBox(boxItem) {
  const boxKeys = [];
  if (boxItem.number) boxKeys.push(boxItem.number.trim());
  if (boxItem.name) boxKeys.push(boxItem.name.trim());

  return Object.values(db.items).filter(child => {
    if (child.id === boxItem.id) return false;
    const currentLoc = (child.currentLocation || "").trim();
    const initLoc = (child.initialLocation || "").trim();
    return boxKeys.includes(currentLoc) || boxKeys.includes(initLoc);
  });
}

function recordDeparture() {
  let method = document.querySelector('input[name="method"]:checked').value;
  if (method === "その他") {
    method = document.getElementById("customMethod").value.trim();
    if (!method) { alert("移動方法を入力してください。"); return; }
  }
  const rows = [...document.querySelectorAll("#itemInputs .item-row")];
  const entries = rows.map(r => ({
    number: r.querySelector(".item-number").value.trim(),
    name: r.querySelector(".item-name").value.trim()
  })).filter(x => x.number || x.name);

  if (!entries.length) { alert("出発する物品を入力してください。"); return; }

  for (const x of entries) {
    const existing = findItemByInput(x.number, x.name);
    if (!existing && x.number && !x.name) {
      alert(`番号「${x.number}」は登録されていません。\n新規登録のため、物品名を入力してください。`);
      return;
    }
  }

  const baseTime = Date.now();
  let totalMovedCount = 0;

  for (let i = 0; i < entries.length; i++) {
    const x = entries[i];
    const existing = findItemByInput(x.number, x.name);
    const key = existing ? existing.id : itemKey(x.number, x.name);

    const createStamp = new Date(baseTime + i * 10).toISOString();
    const departureStamp = new Date(baseTime + i * 10 + 1).toISOString();

    if (!db.items[key]) {
      db.items[key] = {
        id:key, number:x.number||"", name:x.name,
        currentLocation:"輸送中", initialLocation:"107室", status:"輸送中", method:method,
        departureAt:departureStamp, arrivalAt:null, updatedAt:departureStamp
      };

      db.history.push({
        id: String(Date.now()+Math.random()), itemId:key, number:x.number||"",
        name:x.name, type:"create", from:"107室", to:"?", method:"新規追加", timestamp:createStamp,
        user: currentUser
      });
    } else {
      const item = db.items[key];
      if (item.status === "輸送中") {
        alert(`${item.number || item.name} はすでに輸送中です。`);
        continue;
      }
      item.currentLocation = "輸送中"; item.status = "輸送中"; item.method = method;
      item.departureAt = departureStamp; item.arrivalAt = null; item.updatedAt = departureStamp;
    }

    db.history.push({
      id: String(Date.now()+Math.random()), itemId:key, number:db.items[key].number,
      name:db.items[key].name, type:"departure", from:"107室", to:"輸送中", method:method, timestamp:departureStamp,
      user: currentUser
    });
    totalMovedCount++;

    const boxItem = db.items[key];
    const children = getChildItemsInBox(boxItem);
    let childIdx = 2;
    for (const child of children) {
      if (child.status !== "輸送中") {
        const childStamp = new Date(baseTime + i * 10 + childIdx++).toISOString();
        const originLoc = child.currentLocation;
        const childMethod = `${method} (${boxItem.name || boxItem.number}に同伴)`;
        child.currentLocation = "輸送中";
        child.status = "輸送中";
        child.method = childMethod;
        child.departureAt = childStamp;
        child.arrivalAt = null;
        child.updatedAt = childStamp;

        db.history.push({
          id: String(Date.now()+Math.random()), itemId:child.id, number:child.number,
          name:child.name, type:"departure", from:originLoc, to:"輸送中",
          method:childMethod, timestamp:childStamp,
          user: currentUser
        });
        totalMovedCount++;
      }
    }
  }

  save();
  alert(`${totalMovedCount}件の物品/箱（連動物品含む）の出発を記録しました。`);
  clearForm();
}

function recordArrival() {
  const rows = [...document.querySelectorAll("#arrivalInputs .item-row")];
  const entries = rows.map(r => ({
    number: r.querySelector(".item-number").value.trim(),
    name: r.querySelector(".item-name").value.trim()
  })).filter(x => x.number || x.name);

  if (!entries.length) { alert("到着した物品を入力してください。"); return; }

  const baseTime = Date.now();
  const targets = [];

  for (const x of entries) {
    const item = findItemByInput(x.number, x.name);
    if (!item) { alert(`${x.number || x.name} は未登録です。`); return; }
    if (item.status !== "輸送中") { alert(`${item.number || item.name} は輸送中ではありません。`); return; }
    targets.push(item);
  }

  let totalArrivedCount = 0;

  for (let i = 0; i < targets.length; i++) {
    const item = targets[i];
    const stamp = new Date(baseTime + i * 10).toISOString();

    db.history.push({
      id: String(Date.now()+Math.random()), itemId:item.id, number:item.number,
      name:item.name, type:"arrival", from:"輸送中", to:"324室", method:"", timestamp:stamp,
      user: currentUser
    });
    item.currentLocation = "324室"; item.status = "到着済み"; item.arrivalAt = stamp; item.updatedAt = stamp;
    totalArrivedCount++;

    const children = getChildItemsInBox(item);
    let childIdx = 1;
    for (const child of children) {
      if (child.status === "輸送中") {
        const childStamp = new Date(baseTime + i * 10 + childIdx++).toISOString();
        const returnBoxLoc = item.name || item.number || "324室";
        const childMethod = `(${returnBoxLoc}に同伴)`;

        db.history.push({
          id: String(Date.now()+Math.random()), itemId:child.id, number:child.number,
          name:child.name, type:"arrival", from:"輸送中", to:returnBoxLoc,
          method:childMethod, timestamp:childStamp,
          user: currentUser
        });
        child.currentLocation = returnBoxLoc;
        child.status = "到着済み";
        child.method = childMethod;
        child.arrivalAt = childStamp;
        child.updatedAt = childStamp;
        totalArrivedCount++;
      }
    }
  }

  save();
  alert(`${totalArrivedCount}件の物品/箱（連動物品含む）の到着を記録しました。`);
  clearArrivalForm();
}

}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const items = Object.values(db.items).filter(x =>
    !q || [x.number, x.name, x.currentLocation, x.status, x.method].join(" ").toLowerCase().includes(q)
  ).sort((a,b) => (a.order ?? 9999) - (b.order ?? 9999));

  const tbody = document.getElementById("itemsTable");
  tbody.innerHTML = items.length ? items.map(x => `
    <tr>
      <td>${esc(x.number || "?")}</td>
      <td class="truncate" title="${escAttr(x.name || '')}">${esc(x.name || "?")}</td>
      <td><span class="badge ${x.status==="輸送中"?"blue":(x.status==="到着済み"?"red":"green")}">${esc(x.status || "未出発")}</span></td>
      <td>${esc(x.currentLocation || "?")}</td>
      <td>${esc(x.method || "?")}</td>

          <button class="small" onclick="editItem('${escJs(x.id)}')">編集</button>
          <button class="small danger" onclick="deleteItem('${escJs(x.id)}')">消去</button>
        </div>
      </td>
    </tr>`).join("") : `<tr><td colspan="7" class="empty">該当する物品はありません</td></tr>`;

  let hs = [...db.history].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  if (historyFilter === "create") {
    hs = hs.filter(h => h.type === "create");
  } else if (historyFilter === "delivery") {
    hs = hs.filter(h => h.type === "departure" || h.type === "arrival");
  }

  const ht = document.getElementById("historyTable");
  ht.innerHTML = hs.length ? hs.map(h => {
    let typeBadge = "";
    if (h.type === "create") typeBadge = `<span class="badge purple">物品追加</span>`;
    else if (h.type === "departure") typeBadge = `<span class="badge blue">${esc(h.method || '出発')}</span>`;
    else if (h.type === "arrival") typeBadge = `<span class="badge red">到着 ${esc(h.method || '')}</span>`;

    return `
    <tr>
      <td>${fmt(h.timestamp)}</td>
      <td><b>${esc(h.user || "?")}</b></td>
      <td><b>${esc(h.number || "番号なし")}</b><br>${esc(h.name || "")}</td>
      <td>${esc(h.from)}</td>
      <td>${esc(h.to)}</td>
      <td>${typeBadge}</td>
      <td>
        <div class="btn-group">
          <button class="small" onclick="editHistory('${escJs(h.id)}')">編集</button>
          <button class="small danger" onclick="deleteHistory('${escJs(h.id)}')">削除</button>
        </div>
      </td>
    </tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">対象の履歴はありません</td></tr>`;

  const locations = new Set(Object.values(db.items).map(x=>x.currentLocation).filter(Boolean));
  document.getElementById("statItems").textContent = Object.keys(db.items).length;
  document.getElementById("statMoved").textContent = db.history.length;
  document.getElementById("statMoving").textContent = Object.values(db.items).filter(x=>x.status==="輸送中").length;
  document.getElementById("statLocations").textContent = locations.size;
}

  const item = db.items[id];

  const label = item.number ? `${item.number} (${item.name})` : item.name;
  if (confirm(`「${label}」を消去しますか？\n※関連する移動履歴も削除されます。`)) {
    delete db.items[id];
    db.history = db.history.filter(h => h.itemId !== id);

function deleteHistory(id) {
  const h = db.history.find(x => x.id === id);
  if (!h) return;

  if (confirm("この履歴を削除しますか？\n（物品の現在の状況も自動再計算されます）")) {
    const itemId = h.itemId;
    db.history = db.history.filter(x => x.id !== id);

function getUniqueLocations() {
  const set = new Set(["107室", "324室", "輸送中", "未確認", "?"]);
  Object.values(db.items).forEach(x => {
    if (x.currentLocation) set.add(x.currentLocation);
    if (x.initialLocation) set.add(x.initialLocation);
  });
  db.history.forEach(h => {
    if (h.from) set.add(h.from);
    if (h.to) set.add(h.to);
  });
  return Array.from(set);
}

function getUniqueMethods() {
  const set = new Set(["新規追加", "手運び", "業者・人間輸送", "トラック輸送", "その他", "?"]);
  Object.values(db.items).forEach(x => { if (x.method) set.add(x.method); });
  db.history.forEach(h => { if (h.method) set.add(h.method); });
  return Array.from(set);
}

        <div class="event">
          <div class="time">${fmt(h.timestamp)} (担当: ${esc(h.user || '未記録')})</div>
          <b>${title}</b> (${esc(h.from)} →${esc(h.to)})
        </div>`;
      }).join("") : "<p>履歴なし</p>"}
    </div>`;
  openModal();
}
